<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>解剖学 筋マッチング（主要30筋）</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Inter"', '"Noto Sans JP"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              200: '#99f6e4',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              800: '#115e59',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* 基本設定とモバイル操作の最適化 */
    body {
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }

    /* 不正解時のシェイクアニメーション */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    .animate-shake {
      animation: shake 0.35s cubic-bezier(.36,.07,.19,.97) both;
    }

    /* 正解時のポップアニメーション */
    @keyframes popMatch {
      0% { transform: scale(1); }
      40% { transform: scale(1.04); }
      100% { transform: scale(0.95); opacity: 0.25; }
    }
    .animate-match {
      animation: popMatch 0.35s ease-out forwards;
    }

    /* バナーのスライドイン */
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-slide-up {
      animation: slideUp 0.25s ease-out forwards;
    }

    /* スクロールバーの微調整 */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex justify-center items-start sm:py-6">

  <!-- アプリ全体コンテナ（スマホ縦画面最適化：最大幅480px） -->
  <div id="app" class="w-full max-w-[480px] min-h-screen sm:min-h-[780px] bg-white sm:rounded-3xl sm:shadow-xl sm:border border-slate-200 flex flex-col relative overflow-hidden">

    <!-- ==========================================
         画面1: スタート画面
         ========================================== -->
    <section id="screen-start" class="flex-1 flex flex-col p-5 pb-8">
      <!-- ヘッダー -->
      <header class="flex items-start justify-between mb-5">
        <div>
          <span class="inline-block px-2.5 py-0.5 text-xs font-bold tracking-wide text-teal-700 bg-teal-50 border border-teal-200 rounded-full mb-1.5">
            OT 1年次 基礎解剖学
          </span>
          <h1 class="text-xl sm:text-2xl font-extrabold text-slate-900 tracking-tight leading-snug">
            解剖学 筋マッチング<span class="text-teal-600 text-base sm:text-lg block sm:inline sm:ml-1 font-bold">（主要30筋）</span>
          </h1>
        </div>
        <!-- 効果音ON/OFFボタン -->
        <button type="button" class="btn-sound-toggle p-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 transition active:scale-95" aria-label="効果音の切り替え" title="効果音 ON/OFF">
          <!-- アイコンはJSで描画 -->
        </button>
      </header>

      <!-- 単元選択 -->
      <div class="mb-5">
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">
          1. 単元を選ぶ
        </label>
        <div id="unit-selector" class="grid grid-cols-1 gap-2">
          <!-- JSで単元カードを生成 -->
        </div>
      </div>

      <!-- 出題モード選択 -->
      <div class="mb-5">
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">
          2. 出題モードを選ぶ
        </label>
        <div id="mode-selector" class="grid grid-cols-1 gap-2">
          <!-- JSでモードカードを生成 -->
        </div>
      </div>

      <!-- 選択中のベストタイム表示 -->
      <div class="bg-teal-50/70 border border-teal-100 rounded-2xl p-3.5 mb-5 flex items-center justify-between">
        <div class="flex items-center gap-2 text-teal-800">
          <svg class="w-5 h-5 text-teal-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          <span class="text-xs font-bold">選択中のベストタイム</span>
        </div>
        <span id="start-best-time" class="text-base font-extrabold text-teal-700 font-mono">--:--.-</span>
      </div>

      <!-- スタートボタン群 -->
      <div class="mt-auto space-y-3">
        <button id="btn-start-normal" type="button" class="w-full py-4 px-6 bg-teal-600 hover:bg-teal-700 active:scale-[0.98] text-white font-extrabold text-lg rounded-2xl shadow-md shadow-teal-600/20 transition flex items-center justify-center gap-2">
          <span>スタート！</span>
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 7l5 5m0 0l-5 5m5-5H6"></path>
          </svg>
        </button>

        <!-- 弱点だけ復習ボタンエリア -->
        <div id="weak-section" class="hidden pt-1">
          <div class="flex items-center gap-2">
            <button id="btn-start-weak" type="button" class="flex-1 py-3.5 px-4 bg-amber-500 hover:bg-amber-600 active:scale-[0.98] text-white font-bold text-sm rounded-2xl shadow-md shadow-amber-500/20 transition flex items-center justify-center gap-2">
              <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
              </svg>
              <span>弱点だけ復習（<span id="weak-count">0</span>筋）</span>
            </button>
            <button id="btn-reset-weak" type="button" class="py-3.5 px-3 bg-slate-100 hover:bg-rose-50 hover:text-rose-600 text-slate-500 text-xs font-bold rounded-2xl border border-slate-200 transition active:scale-95" title="弱点リストをリセット">
              リセット
            </button>
          </div>
          <p class="text-[11px] text-slate-500 text-center mt-1.5">
            ※ 弱点復習でノーミス正解するとリストから自動解除されます
          </p>
        </div>
      </div>
    </section>


    <!-- ==========================================
         画面2: プレイ画面
         ========================================== -->
    <section id="screen-play" class="hidden flex-1 flex flex-col h-full bg-slate-50">
      <!-- 上部ステータスバー -->
      <header class="bg-white border-b border-slate-200 px-3.5 py-3 flex items-center justify-between gap-2 sticky top-0 z-20">
        <button id="btn-quit" type="button" class="px-2.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-bold transition active:scale-95 flex items-center gap-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
          </svg>
          中断
        </button>

        <div class="flex items-center gap-3">
          <!-- タイマー -->
          <div class="text-center">
            <div class="text-[10px] font-bold text-slate-400 leading-none mb-0.5">TIME</div>
            <div id="play-timer" class="text-base font-extrabold font-mono text-slate-800 leading-none">00:00.0</div>
          </div>

          <div class="h-6 w-px bg-slate-200"></div>

          <!-- 残りペア数 -->
          <div class="text-center">
            <div class="text-[10px] font-bold text-slate-400 leading-none mb-0.5">残りペア</div>
            <div id="play-remaining" class="text-sm font-extrabold text-teal-700 leading-none">5/10</div>
          </div>

          <!-- コンボ表示 -->
          <div id="play-combo-wrap" class="hidden bg-amber-100 text-amber-800 px-2 py-1 rounded-lg text-xs font-extrabold border border-amber-200">
            <span id="play-combo">0</span><span class="text-[10px] ml-0.5">COMBO</span>
          </div>
        </div>

        <!-- 効果音ON/OFF -->
        <button type="button" class="btn-sound-toggle p-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 transition active:scale-95" aria-label="効果音の切り替え">
          <!-- アイコンはJSで描画 -->
        </button>
      </header>

      <!-- サブヘッダー（現在のモード・ラウンド情報） -->
      <div class="px-4 py-2 bg-teal-600 text-white flex items-center justify-between text-xs font-bold">
        <span id="play-info-label" class="truncate">上肢帯・上腕 / 初級：支配神経</span>
        <span id="play-round-badge" class="bg-teal-800/60 px-2 py-0.5 rounded-full text-[11px] shrink-0 ml-2">Round 1/2</span>
      </div>

      <!-- 操作ガイド -->
      <div class="px-4 pt-3 pb-1 flex justify-between text-[11px] font-bold text-slate-500">
        <span class="w-[46%] text-center">左：筋名</span>
        <span class="w-[52%] text-center" id="play-right-col-label">右：支配神経</span>
      </div>

      <!-- マッチングカード2カラムエリア -->
      <div id="matching-board" class="flex-1 px-3 py-2 grid grid-cols-12 gap-2.5 content-start pb-28">
        <!-- 左列（筋名：5カラム幅） -->
        <div id="col-left" class="col-span-5 flex flex-col gap-2.5">
          <!-- JSで左カード5枚を生成 -->
        </div>
        <!-- 右列（解答：7カラム幅） -->
        <div id="col-right" class="col-span-7 flex flex-col gap-2.5">
          <!-- JSで右カード5枚を生成 -->
        </div>
      </div>

      <!-- 不正解時のヒントバナー（画面下部固定） -->
      <div id="hint-banner" class="hidden fixed sm:absolute bottom-0 left-0 right-0 z-30 p-3 pointer-events-none">
        <div class="max-w-[456px] mx-auto bg-rose-600 text-white rounded-2xl shadow-lg p-3.5 border border-rose-500 animate-slide-up pointer-events-auto">
          <div class="flex items-start justify-between gap-2 mb-1">
            <span class="inline-flex items-center gap-1 text-xs font-extrabold bg-rose-800/60 px-2 py-0.5 rounded-md">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
              </svg>
              正解を確認！
            </span>
            <button id="btn-close-hint" type="button" class="text-rose-200 hover:text-white p-0.5">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
              </svg>
            </button>
          </div>
          <p id="hint-answer-text" class="text-sm font-extrabold leading-snug mb-1"></p>
          <p id="hint-tip-text" class="text-xs text-rose-100 leading-relaxed"></p>
        </div>
      </div>
    </section>


    <!-- ==========================================
         画面3: リザルト＆グループ共有画面
         ========================================== -->
    <section id="screen-result" class="hidden flex-1 flex flex-col p-5 pb-8 bg-slate-50 overflow-y-auto">
      <!-- クリアヘッダー -->
      <div class="text-center mb-5">
        <div id="result-new-record" class="hidden inline-block mb-1.5 px-3 py-0.5 bg-amber-400 text-amber-950 text-xs font-extrabold rounded-full shadow-sm tracking-wide">
          ★ NEW RECORD! ★
        </div>
        <h2 class="text-2xl font-extrabold text-slate-900">クリア！おつかれさま！</h2>
        <p id="result-subtitle" class="text-xs font-bold text-slate-500 mt-1"></p>
      </div>

      <!-- スコアサマリーカード -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 mb-5">
        <div class="grid grid-cols-3 divide-x divide-slate-100 text-center">
          <div class="px-1">
            <div class="text-[11px] font-bold text-slate-400 mb-1">ランク</div>
            <div id="result-rank" class="text-3xl font-extrabold text-teal-600 leading-none">S</div>
          </div>
          <div class="px-1">
            <div class="text-[11px] font-bold text-slate-400 mb-1">クリアタイム</div>
            <div id="result-time" class="text-lg sm:text-xl font-extrabold font-mono text-slate-800 mt-1 leading-none">00:24.5</div>
          </div>
          <div class="px-1">
            <div class="text-[11px] font-bold text-slate-400 mb-1">ミス回数</div>
            <div id="result-misses" class="text-xl font-extrabold text-slate-800 mt-1 leading-none">0<span class="text-xs font-bold text-slate-400 ml-0.5">回</span></div>
          </div>
        </div>
      </div>

      <!-- グループ学習用：ひとこと解説お題ボックス -->
      <div class="bg-gradient-to-br from-teal-600 to-emerald-600 rounded-2xl p-4 text-white shadow-md mb-5">
        <div class="flex items-center gap-2 mb-2">
          <span class="bg-white/20 text-white text-[11px] font-extrabold px-2.5 py-0.5 rounded-full">
            グループ学習用
          </span>
          <h3 class="text-sm font-extrabold">ひとこと解説お題</h3>
        </div>
        <p id="group-topic-text" class="text-sm font-bold leading-relaxed mb-3 bg-black/10 rounded-xl p-3">
          <!-- JSでお題テキストを挿入 -->
        </p>

        <!-- タップで開閉する解答確認ボタン -->
        <button id="btn-toggle-topic-answer" type="button" class="w-full py-2.5 px-3 bg-white/15 hover:bg-white/25 rounded-xl text-xs font-bold flex items-center justify-between transition">
          <span>解答データを確認する（起始・停止・神経・作用）</span>
          <svg id="topic-chevron" class="w-4 h-4 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path>
          </svg>
        </button>

        <div id="group-topic-answer" class="hidden mt-2.5 bg-white text-slate-800 rounded-xl p-3.5 text-xs space-y-1.5 shadow-inner">
          <!-- JSで解答詳細を描画 -->
        </div>
      </div>

      <!-- 今回のミス一覧 -->
      <div class="mb-6">
        <h3 class="text-xs font-extrabold text-slate-500 uppercase tracking-wider mb-2.5 flex items-center justify-between">
          <span>今回のミス一覧</span>
          <span id="result-mistake-count-badge" class="text-[11px] font-bold text-rose-600"></span>
        </h3>
        <div id="result-mistakes-container" class="space-y-2.5">
          <!-- JSでミスカードまたはパーフェクト表示を描画 -->
        </div>
      </div>

      <!-- アクションボタン -->
      <div class="mt-auto grid grid-cols-2 gap-3 pt-2">
        <button id="btn-retry" type="button" class="py-3.5 px-4 bg-teal-600 hover:bg-teal-700 active:scale-[0.98] text-white font-extrabold text-sm rounded-2xl shadow-md shadow-teal-600/20 transition">
          もう一度挑戦
        </button>
        <button id="btn-back-title" type="button" class="py-3.5 px-4 bg-white hover:bg-slate-100 active:scale-[0.98] text-slate-700 font-extrabold text-sm rounded-2xl border border-slate-300 transition">
          タイトルへ戻る
        </button>
      </div>
    </section>


    <!-- ==========================================
         カスタム確認モーダル（alert/confirm代替）
         ========================================== -->
    <div id="custom-modal" class="hidden fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-[2px] flex items-center justify-center p-4">
      <div class="bg-white w-full max-w-[340px] rounded-2xl p-5 shadow-2xl border border-slate-100">
        <h3 id="modal-title" class="text-base font-extrabold text-slate-900 mb-2">確認</h3>
        <p id="modal-message" class="text-sm text-slate-600 leading-relaxed mb-5"></p>
        <div class="flex gap-2.5 justify-end">
          <button id="modal-cancel" type="button" class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition">
            キャンセル
          </button>
          <button id="modal-confirm" type="button" class="px-4 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold transition">
            実行する
          </button>
        </div>
      </div>
    </div>

  </div>

  <script>
    /**
     * =========================================================================
     * 1. マスターデータ（作業療法士1年次 主要30筋）
     * =========================================================================
     */
    const MUSCLE_DATA = [
      { id: "m001", unit: "上肢帯・上腕", name: "僧帽筋", origin: "後頭骨・項靭帯・C7〜T12棘突起", insertion: "鎖骨外側1/3・肩峰・肩甲棘", nerve: "副神経（C2〜C4頸神経）", action: "肩甲骨の挙上・内転・下制・上方回旋", hint: "背中上部を広く覆う筋。上部は肩をすくめる動き。" },
      { id: "m002", unit: "上肢帯・上腕", name: "前鋸筋", origin: "第1〜9肋骨", insertion: "肩甲骨内側縁（前面）", nerve: "長胸神経（C5〜C7）", action: "肩甲骨の外転・上方回旋", hint: "麻痺すると「翼状肩甲」になるのが国試の超頻出ポイント！" },
      { id: "m003", unit: "上肢帯・上腕", name: "大胸筋", origin: "鎖骨内側・胸骨・第1〜6肋軟骨", insertion: "上腕骨大結節稜", nerve: "内側・外側胸筋神経（C5〜T1）", action: "肩関節の内転・内旋・水平屈曲", hint: "胸の厚い筋。腕を前に組む・抱きしめる動きで働く。" },
      { id: "m004", unit: "上肢帯・上腕", name: "広背筋", origin: "T6〜L5棘突起・仙骨・腸骨稜", insertion: "上腕骨小結節稜", nerve: "胸背神経（C6〜C8）", action: "肩関節の伸展・内転・内旋", hint: "松葉杖をつく時や、懸垂で体を引き上げる時に大活躍。" },
      { id: "m005", unit: "上肢帯・上腕", name: "三角筋", origin: "鎖骨外側1/3・肩峰・肩甲棘", insertion: "上腕骨三角筋粗面", nerve: "腋窩神経（C5〜C6）", action: "肩関節の外転（前部：屈曲、後部：伸展）", hint: "肩の丸みを作る筋。肩関節脱臼で腋窩神経が傷つきやすい。" },
      { id: "m006", unit: "上肢帯・上腕", name: "棘上筋", origin: "肩甲骨の棘上窩", insertion: "上腕骨大結節（上部）", nerve: "肩甲上神経（C5〜C6）", action: "肩関節の外転（初動）", hint: "回旋筋腱板（ローテーターカフ）の1つ。最も断裂しやすい。" },
      { id: "m007", unit: "上肢帯・上腕", name: "棘下筋", origin: "肩甲骨の棘下窩", insertion: "上腕骨大結節（中部）", nerve: "肩甲上神経（C5〜C6）", action: "肩関節の外旋", hint: "回旋筋腱板の1つ。肩を外にひねる（外旋）主役。" },

    /**
     * =========================================================================
     * 2. Web Audio API サウンドマネージャー（外部音声ファイル不要）
     * =========================================================================
     */
    const SoundManager = {
      ctx: null,
      isMuted: false,

      init() {
        try {
          const savedMute = localStorage.getItem(STORAGE_KEYS.MUTE);
          this.isMuted = savedMute === "true";
        } catch (e) {
          this.isMuted = false;
        }
        this.updateButtons();
      },

      ensureContext() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            this.ctx = new AudioCtx();
          }
        }
        if (this.ctx && this.ctx.state === "suspended") {
          this.ctx.resume();
        }
      },

      toggleMute() {
        this.isMuted = !this.isMuted;
        try {
          localStorage.setItem(STORAGE_KEYS.MUTE, String(this.isMuted));
        } catch (e) {}
        this.updateButtons();
        if (!this.isMuted) {
          this.playTap();
        }
      },

      updateButtons() {
        const iconOn = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg>`;
        const iconOff = `<svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path></svg>`;
        document.querySelectorAll(".btn-sound-toggle").forEach(btn => {
          btn.innerHTML = this.isMuted ? iconOff : iconOn;
        });
      },

      playTone(freq, duration, type = "sine", volume = 0.12, delay = 0) {
        if (this.isMuted) return;
        try {
          this.ensureContext();
          if (!this.ctx) return;
          const now = this.ctx.currentTime + delay;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(volume, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + duration);
        } catch (e) {}
      },

      playTap() {
        this.playTone(520, 0.06, "sine", 0.06);
      },

      playCorrect() {
        // 爽やかな2音チャイム（ピンポン）

      playWrong() {

        notes.forEach((n, idx) => {
          this.playTone(n, idx === 3 ? 0.45 : 0.14, "sine", 0.13, idx * 0.1);
        });
      }

        this.saveWeakList(list);

      getBestTimes() {

        }

      getBestTime(unitId, modeId) {
        const bests = this.getBestTimes();
        const key = `${unitId}_${modeId}`;
        return typeof bests[key] === "number" ? bests[key] : null;
      },

      updateBestTime(unitId, modeId, elapsedMs) {
        const bests = this.getBestTimes();
        const key = `${unitId}_${modeId}`;
        const prev = bests[key];
        if (typeof prev !== "number" || elapsedMs < prev) {
          bests[key] = elapsedMs;
          try {
            localStorage.setItem(STORAGE_KEYS.BEST, JSON.stringify(bests));
          } catch (e) {}
          return true; // 新記録
        }
        return false;
      }

    /**
     * =========================================================================
     * 5. ユーティリティ関数
     * =========================================================================
     */
    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function formatTime(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      const tenths = Math.floor((ms % 1000) / 100);
      return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}.${tenths}`;
    }

    /**
     * 出題モードに応じた解答テキスト（比較・表示用）を取得
     */
    function getAnswerText(muscle, modeId) {
      if (modeId === "nerve") return muscle.nerve;
      if (modeId === "action") return muscle.action;
      if (modeId === "origin_insertion") return `起始:${muscle.origin} / 停止:${muscle.insertion}`;
      return muscle.nerve;
    }

     * 右カード表示用のHTML（上級は起始・停止を見やすく2行分け）
     */
    function getAnswerCardHTML(muscle, modeId) {
      if (modeId === "origin_insertion") {
        return `
          <div class="text-left w-full space-y-1">
            <div class="leading-tight"><span class="inline-block text-[10px] font-extrabold text-teal-700 bg-teal-50 px-1 rounded mr-1">起</span><span class="text-[11px] font-semibold text-slate-700">${muscle.origin}</span></div>
            <div class="leading-tight"><span class="inline-block text-[10px] font-extrabold text-emerald-700 bg-emerald-50 px-1 rounded mr-1">停</span><span class="text-[11px] font-semibold text-slate-700">${muscle.insertion}</span></div>
          </div>
        `;
      }
      return `<span class="text-xs sm:text-[13px] font-bold leading-snug text-slate-800">${getAnswerText(muscle, modeId)}</span>`;
    }

    /**
     * 同じ5枚バッチ内に同一解答テキストが極力被らないようにバッチ分割する
     */
    function buildSmartBatches(muscles, modeId, batchSize = 5) {
      const shuffled = shuffle(muscles);
      const totalBatches = Math.ceil(shuffled.length / batchSize);
      if (totalBatches <= 1) {
        return [shuffled];
      }

      const batches = Array.from({ length: totalBatches }, () => []);
      const leftovers = [];

      // まず、各バッチに解答テキストが重複しないように優先配置
      for (const m of shuffled) {
        const ans = getAnswerText(m, modeId);
        let placed = false;
        // 最も枚数が少ないバッチのうち、同じ解答がないバッチを探す
        const candidateIndices = batches
          .map((b, idx) => ({ idx, len: b.length }))
          .filter(item => item.len < batchSize)
          .sort((a, b) => a.len - b.len);

        for (const c of candidateIndices) {
          const hasDup = batches[c.idx].some(existing => getAnswerText(existing, modeId) === ans);
          if (!hasDup) {
            batches[c.idx].push(m);
            placed = true;
            break;
          }
        }
        if (!placed) {
          leftovers.push(m);
        }
      }

      // どうしても重複せざるを得ない残りを空きスロットに配置
      for (const m of leftovers) {
        const target = batches.find(b => b.length < batchSize);
        if (target) target.push(m);
      }

      return batches.filter(b => b.length > 0);
    }

      const btnConfirm = document.getElementById("modal-confirm");
      const btnCancel = document.getElementById("modal-cancel");

      btnConfirm.textContent = confirmText;
      btnConfirm.className = `px-4 py-2.5 rounded-xl text-white text-xs font-bold transition ${confirmClass}`;

      const close = () => {
        modal.classList.add("hidden");
        btnConfirm.onclick = null;
        btnCancel.onclick = null;
      };

      btnCancel.onclick = close;
      btnConfirm.onclick = () => {
        close();
        if (onConfirm) onConfirm();
      };

      modal.classList.remove("hidden");
    }

    /**
     * =========================================================================
     * 7. 画面切り替え＆スタート画面描画
     * =========================================================================
     */
    function showScreen(screenId) {
      ["screen-start", "screen-play", "screen-result"].forEach(id => {
        const el = document.getElementById(id);
        if (id === screenId) {
          el.classList.remove("hidden");
        } else {
          el.classList.add("hidden");
        }
      });
      window.scrollTo({ top: 0, behavior: "instant" });
    }

    function renderStartScreen() {
      // 単元リスト描画
      const unitContainer = document.getElementById("unit-selector");
      unitContainer.innerHTML = "";
      UNITS.forEach(u => {
        const isSelected = state.selectedUnit === u.id;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `w-full px-3.5 py-2.5 rounded-xl border-2 text-left flex items-center justify-between transition active:scale-[0.99] ${
          isSelected
            ? "border-teal-600 bg-teal-50/80 text-teal-900 shadow-sm"
            : "border-slate-200 bg-white text-slate-700 hover:border-teal-300"
        }`;
        btn.innerHTML = `
          <div class="flex items-center gap-2.5">
            <span class="w-4 h-4 rounded-full border-2 flex items-center justify-center shrink-0 ${
              isSelected ? "border-teal-600" : "border-slate-300"
            }">
              ${isSelected ? '<span class="w-2 h-2 rounded-full bg-teal-600"></span>' : ""}
            </span>
            <span class="text-sm font-bold">${u.label}</span>
          </div>
          <span class="text-xs font-bold px-2 py-0.5 rounded-full ${
            isSelected ? "bg-teal-600 text-white" : "bg-slate-100 text-slate-500"
          }">${u.countLabel}</span>
        `;
        btn.onclick = () => {
          SoundManager.playTap();
          state.selectedUnit = u.id;
          renderStartScreen();
        };
        unitContainer.appendChild(btn);
      });

      // 出題モード描画
      const modeContainer = document.getElementById("mode-selector");
      modeContainer.innerHTML = "";
      MODES.forEach(m => {
        const isSelected = state.selectedMode === m.id;
        const badgeColor = m.id === "nerve"
          ? "bg-emerald-100 text-emerald-800"
          : m.id === "action"
          ? "bg-sky-100 text-sky-800"
          : "bg-indigo-100 text-indigo-800";

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `w-full px-3.5 py-2.5 rounded-xl border-2 text-left flex items-center justify-between transition active:scale-[0.99] ${
          isSelected
            ? "border-teal-600 bg-teal-50/80 text-teal-900 shadow-sm"
            : "border-slate-200 bg-white text-slate-700 hover:border-teal-300"
        }`;
        btn.innerHTML = `
          <div class="flex items-center gap-2.5">
            <span class="text-[11px] font-extrabold px-2 py-0.5 rounded-md ${badgeColor}">${m.badge}</span>
            <span class="text-sm font-bold">${m.label}</span>
          </div>
          ${isSelected ? '<svg class="w-5 h-5 text-teal-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>' : ""}
        `;
        btn.onclick = () => {
          SoundManager.playTap();
          state.selectedMode = m.id;
          renderStartScreen();
        };
        modeContainer.appendChild(btn);
      });

      // ベストタイム表示更新
      const bestMs = Storage.getBestTime(state.selectedUnit, state.selectedMode);
      document.getElementById("start-best-time").textContent = bestMs !== null ? formatTime(bestMs) : "--:--.-";

      // 弱点復習ボタン更新
      const weakIds = Storage.getWeakList();
      const weakSection = document.getElementById("weak-section");
      if (weakIds.length > 0) {
        weakSection.classList.remove("hidden");
        document.getElementById("weak-count").textContent = weakIds.length;
      } else {
        weakSection.classList.add("hidden");
      }
    }

    /**
     * =========================================================================
     * 8. ゲーム開始・進行ロジック
     * =========================================================================
     */
    function startGame(isWeakMode = false) {
      SoundManager.playTap();
      state.isWeakMode = isWeakMode;

      let pool = [];
      if (isWeakMode) {
        const weakIds = Storage.getWeakList();
        pool = MUSCLE_DATA.filter(m => weakIds.includes(m.id));
        if (pool.length === 0) {
          renderStartScreen();
          return;
        }
      } else if (state.selectedUnit === "ALL_RANDOM") {
        pool = shuffle(MUSCLE_DATA).slice(0, 10);
      } else {
        pool = MUSCLE_DATA.filter(m => m.unit === state.selectedUnit);
      }

      state.allSessionMuscles = pool;
      state.batches = buildSmartBatches(pool, state.selectedMode, 5);
      state.currentBatchIndex = 0;
      state.totalPairs = pool.length;
      state.clearedPairs = 0;
      state.misses = 0;
      state.combo = 0;
      state.sessionMistakeIds = new Set();

      // ヘッダーラベル更新
      const modeObj = MODES.find(m => m.id === state.selectedMode);
      const unitLabel = isWeakMode
        ? "弱点復習"
        : (UNITS.find(u => u.id === state.selectedUnit)?.label || "");
      document.getElementById("play-info-label").textContent = `${unitLabel} / ${modeObj.badge}：${modeObj.label.replace("筋名 ↔ ", "")}`;
      document.getElementById("play-right-col-label").textContent = modeObj.colLabel;

      hideHintBanner();
      showScreen("screen-play");
      loadBatch(0);
      startTimer();
    }

    function loadBatch(batchIndex) {
      state.currentBatchIndex = batchIndex;
      const batch = state.batches[batchIndex];
      state.leftCards = shuffle(batch);
      state.rightCards = shuffle(batch);
      state.matchedLeftSlots = new Set();
      state.matchedRightSlots = new Set();
      state.selectedLeftSlot = null;
      state.selectedRightSlot = null;
      state.isProcessingMismatch = false;

      // ラウンド表示
      const roundBadge = document.getElementById("play-round-badge");
      if (state.batches.length > 1) {
        roundBadge.classList.remove("hidden");
        roundBadge.textContent = `Round ${batchIndex + 1}/${state.batches.length}`;
      } else {
        roundBadge.classList.add("hidden");
      }

      updatePlayStats();
      renderBoard();
    }

    function updatePlayStats() {
      const remaining = state.totalPairs - state.clearedPairs;
      document.getElementById("play-remaining").textContent = `${remaining}/${state.totalPairs}`;

      const comboWrap = document.getElementById("play-combo-wrap");
      if (state.combo >= 2) {
        comboWrap.classList.remove("hidden");
        document.getElementById("play-combo").textContent = state.combo;
      } else {
        comboWrap.classList.add("hidden");
      }
    }

    function renderBoard() {
      const colLeft = document.getElementById("col-left");
      const colRight = document.getElementById("col-right");
      colLeft.innerHTML = "";
      colRight.innerHTML = "";

      // 左列（筋名）
      state.leftCards.forEach((muscle, idx) => {
        const isMatched = state.matchedLeftSlots.has(idx);
        const isSelected = state.selectedLeftSlot === idx;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.id = `left-card-${idx}`;
        btn.disabled = isMatched;
        btn.className = `w-full min-h-[76px] p-2.5 rounded-2xl border-2 font-extrabold text-sm sm:text-[15px] flex items-center justify-center text-center transition-all duration-150 select-none ${
          isMatched
            ? "border-emerald-200 bg-emerald-50/50 text-emerald-700/40 opacity-35 cursor-default scale-95"
            : isSelected
            ? "border-teal-600 bg-teal-50 text-teal-900 shadow-md ring-2 ring-teal-500/30 scale-[1.02]"
            : "border-slate-200 bg-white text-slate-800 hover:border-teal-300 shadow-sm active:scale-95"
        }`;
        btn.innerHTML = isMatched
          ? `<span class="flex items-center gap-1 text-xs"><svg class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>${muscle.name}</span>`
          : `<span>${muscle.name}</span>`;

        if (!isMatched) {
          btn.onclick = () => onSelectCard("left", idx);
        }
        colLeft.appendChild(btn);
      });

      // 右列（解答）
      state.rightCards.forEach((muscle, idx) => {
        const isMatched = state.matchedRightSlots.has(idx);
        const isSelected = state.selectedRightSlot === idx;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.id = `right-card-${idx}`;
        btn.disabled = isMatched;
        btn.className = `w-full min-h-[76px] p-2.5 rounded-2xl border-2 flex items-center justify-center text-center transition-all duration-150 select-none ${
          isMatched
            ? "border-emerald-200 bg-emerald-50/50 text-emerald-700/40 opacity-35 cursor-default scale-95"
            : isSelected
            ? "border-teal-600 bg-teal-50 text-teal-900 shadow-md ring-2 ring-teal-500/30 scale-[1.02]"
            : "border-slate-200 bg-white text-slate-800 hover:border-teal-300 shadow-sm active:scale-95"
        }`;
        btn.innerHTML = isMatched
          ? `<span class="text-xs font-bold text-emerald-600">✓ クリア</span>`
          : getAnswerCardHTML(muscle, state.selectedMode);

        if (!isMatched) {
          btn.onclick = () => onSelectCard("right", idx);
        }
        colRight.appendChild(btn);
      });
    }

    function onSelectCard(side, slotIdx) {
      if (state.isProcessingMismatch) return;

      SoundManager.playTap();

      if (side === "left") {
        state.selectedLeftSlot = (state.selectedLeftSlot === slotIdx) ? null : slotIdx;
      } else {
        state.selectedRightSlot = (state.selectedRightSlot === slotIdx) ? null : slotIdx;
      }

      // 両方選択されたら判定
      if (state.selectedLeftSlot !== null && state.selectedRightSlot !== null) {
        checkMatch(state.selectedLeftSlot, state.selectedRightSlot);
      } else {
        renderBoard();
      }
    }

    function checkMatch(leftIdx, rightIdx) {
      const leftMuscle = state.leftCards[leftIdx];
      const rightMuscle = state.rightCards[rightIdx];

      // 正解判定：ID一致 または 解答テキスト完全一致
      const isCorrect =
        leftMuscle.id === rightMuscle.id ||
        getAnswerText(leftMuscle, state.selectedMode) === getAnswerText(rightMuscle, state.selectedMode);

      const leftEl = document.getElementById(`left-card-${leftIdx}`);
      const rightEl = document.getElementById(`right-card-${rightIdx}`);

      if (isCorrect) {
        // 正解演出
        SoundManager.playCorrect();
        state.matchedLeftSlots.add(leftIdx);
        state.matchedRightSlots.add(rightIdx);
        state.selectedLeftSlot = null;
        state.selectedRightSlot = null;
        state.clearedPairs++;
        state.combo++;

        // 弱点復習モードで今回ノーミス正解なら弱点から自動解除
        if (state.isWeakMode && !state.sessionMistakeIds.has(leftMuscle.id)) {
          Storage.removeWeak(leftMuscle.id);
        }

        if (leftEl) {
          leftEl.classList.remove("border-teal-600", "bg-teal-50");
          leftEl.classList.add("border-emerald-500", "bg-emerald-100", "animate-match");
        }
        if (rightEl) {
          rightEl.classList.remove("border-teal-600", "bg-teal-50");
          rightEl.classList.add("border-emerald-500", "bg-emerald-100", "animate-match");
        }

        updatePlayStats();

        setTimeout(() => {
          // ラウンド終了チェック
          if (state.matchedLeftSlots.size === state.leftCards.length) {
            if (state.currentBatchIndex + 1 < state.batches.length) {
              loadBatch(state.currentBatchIndex + 1);
            } else {
              finishGame();
            }
          } else {
            renderBoard();
          }
        }, 280);

      } else {
        // 不正解演出
        SoundManager.playWrong();
        state.isProcessingMismatch = true;
        state.misses++;
        state.combo = 0;
        state.sessionMistakeIds.add(leftMuscle.id);
        Storage.addWeak(leftMuscle.id);

        updatePlayStats();

        if (leftEl) {
          leftEl.classList.remove("border-teal-600", "bg-teal-50");
          leftEl.classList.add("border-rose-500", "bg-rose-50", "text-rose-700", "animate-shake");
        }
        if (rightEl) {
          rightEl.classList.remove("border-teal-600", "bg-teal-50");
          rightEl.classList.add("border-rose-500", "bg-rose-50", "text-rose-700", "animate-shake");
        }

        // ヒントバナー表示（3秒間）
        showHintBanner(leftMuscle);

        setTimeout(() => {
          state.selectedLeftSlot = null;
          state.selectedRightSlot = null;
          state.isProcessingMismatch = false;
          renderBoard();
        }, 420);
      }
    }

    function showHintBanner(muscle) {
      const banner = document.getElementById("hint-banner");
      const ansText = getAnswerText(muscle, state.selectedMode);
      document.getElementById("hint-answer-text").textContent = `【${muscle.name}】${ansText}`;
      document.getElementById("hint-tip-text").textContent = `ヒント：${muscle.hint}`;

      banner.classList.remove("hidden");
      if (state.hintTimeout) clearTimeout(state.hintTimeout);
      state.hintTimeout = setTimeout(() => {
        hideHintBanner();
      }, 3500);
    }

    function hideHintBanner() {
      document.getElementById("hint-banner").classList.add("hidden");
      if (state.hintTimeout) {
        clearTimeout(state.hintTimeout);
        state.hintTimeout = null;
      }
    }

    /**
     * =========================================================================
     * 9. タイマー制御
     * =========================================================================
     */
    function startTimer() {
      stopTimer();
      state.startTime = performance.now();
      state.elapsedMs = 0;
      document.getElementById("play-timer").textContent = "00:00.0";
      state.timerInterval = setInterval(() => {
        state.elapsedMs = performance.now() - state.startTime;
        document.getElementById("play-timer").textContent = formatTime(state.elapsedMs);
      }, 50);
    }

    function stopTimer() {
      if (state.timerInterval) {
        clearInterval(state.timerInterval);
        state.timerInterval = null;
      }
    }

    /**
     * =========================================================================
     * 10. クリア処理＆リザルト画面描画
     * =========================================================================
     */
    function finishGame() {
      stopTimer();
      hideHintBanner();
      SoundManager.playFanfare();

      // ベストタイム更新（通常モード時のみ）
      let isNewRecord = false;
      if (!state.isWeakMode) {
        isNewRecord = Storage.updateBestTime(state.selectedUnit, state.selectedMode, state.elapsedMs);
      }

      // ランク計算
      let rank = "B";
      let rankColor = "text-amber-600";
      if (state.misses === 0) {
        rank = "S";
        rankColor = "text-teal-600";
      } else if (state.misses <= 2) {
        rank = "A";
        rankColor = "text-sky-600";
      }

      // ヘッダー・スコア反映
      const newRecordEl = document.getElementById("result-new-record");
      if (isNewRecord) {
        newRecordEl.classList.remove("hidden");
      } else {
        newRecordEl.classList.add("hidden");
      }

      const modeObj = MODES.find(m => m.id === state.selectedMode);
      const unitLabel = state.isWeakMode
        ? "弱点復習モード"
        : (UNITS.find(u => u.id === state.selectedUnit)?.label || "");
      document.getElementById("result-subtitle").textContent = `${unitLabel} ／ ${modeObj.badge}：${modeObj.label}`;

      const rankEl = document.getElementById("result-rank");
      rankEl.textContent = rank;
      rankEl.className = `text-3xl font-extrabold leading-none ${rankColor}`;

      document.getElementById("result-time").textContent = formatTime(state.elapsedMs);
      document.getElementById("result-misses").innerHTML = `${state.misses}<span class="text-xs font-bold text-slate-400 ml-0.5">回</span>`;

      // ミスした筋のリスト
      const mistakeMuscles = Array.from(state.sessionMistakeIds)
        .map(id => MUSCLE_DATA.find(m => m.id === id))
        .filter(Boolean);

      // グループ学習用：ひとこと解説お題のピックアップ
      const topicPool = mistakeMuscles.length > 0 ? mistakeMuscles : state.allSessionMuscles;
      const topicMuscle = topicPool[Math.floor(Math.random() * topicPool.length)];
      renderGroupTopic(topicMuscle);

      // 今回のミス一覧描画
      renderMistakeList(mistakeMuscles);

      showScreen("screen-result");
    }

    function renderGroupTopic(muscle) {
      document.getElementById("group-topic-text").textContent =
        `「${muscle.name}」の起始・停止と動きを、自分の体を使って班のメンバーに実演・解説してみよう！`;

      const answerBox = document.getElementById("group-topic-answer");
      answerBox.classList.add("hidden");
      document.getElementById("topic-chevron").classList.remove("rotate-180");

      answerBox.innerHTML = `
        <div class="font-extrabold text-sm text-teal-800 pb-1 border-b border-slate-100">${muscle.name}（${muscle.unit}）</div>
        <div><span class="font-bold text-slate-500">起始：</span>${muscle.origin}</div>
        <div><span class="font-bold text-slate-500">停止：</span>${muscle.insertion}</div>
        <div><span class="font-bold text-slate-500">支配神経：</span><span class="font-bold text-teal-700">${muscle.nerve}</span></div>
        <div><span class="font-bold text-slate-500">作用：</span>${muscle.action}</div>
        <div class="pt-1 text-amber-800 bg-amber-50 p-2 rounded-lg"><span class="font-bold">💡 ヒント：</span>${muscle.hint}</div>
      `;
    }

    function renderMistakeList(mistakeMuscles) {
      const container = document.getElementById("result-mistakes-container");
      const badge = document.getElementById("result-mistake-count-badge");
      container.innerHTML = "";

      if (mistakeMuscles.length === 0) {
        badge.textContent = "ミスなし！";
        badge.className = "text-[11px] font-bold text-emerald-600";
        container.innerHTML = `
          <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-4 text-center">
            <div class="text-2xl mb-1">🎉</div>
            <p class="text-sm font-extrabold text-emerald-800">パーフェクト！全問ノーミスでクリアしました</p>
            <p class="text-xs text-emerald-700 mt-1">この調子で次のモードや単元にも挑戦しよう！</p>
          </div>
        `;
        return;
      }

      badge.textContent = `${mistakeMuscles.length}筋を弱点リストに登録`;
      badge.className = "text-[11px] font-bold text-rose-600";

      mistakeMuscles.forEach(m => {
        const card = document.createElement("div");
        card.className = "bg-white rounded-2xl p-3.5 border border-rose-100 shadow-sm text-xs space-y-1.5";
        card.innerHTML = `
          <div class="flex items-center justify-between border-b border-slate-100 pb-1.5">
            <span class="text-sm font-extrabold text-slate-900">${m.name}</span>
            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-500">${m.unit}</span>
          </div>
          <div><span class="font-bold text-slate-400">起始：</span><span class="text-slate-700">${m.origin}</span></div>
          <div><span class="font-bold text-slate-400">停止：</span><span class="text-slate-700">${m.insertion}</span></div>
          <div><span class="font-bold text-slate-400">支配神経：</span><span class="font-bold text-teal-700">${m.nerve}</span></div>
          <div><span class="font-bold text-slate-400">作用：</span><span class="text-slate-700">${m.action}</span></div>
          <div class="pt-1 text-rose-800 bg-rose-50/70 p-2 rounded-lg leading-relaxed"><span class="font-bold">💡 </span>${m.hint}</div>
        `;
        container.appendChild(card);
      });
    }

    /**
     * =========================================================================
     * 11. イベントリスナー登録＆初期化
     * =========================================================================
     */
    function initApp() {
      SoundManager.init();
      renderStartScreen();

      // 効果音ON/OFF（スタート画面・プレイ画面共通）
      document.querySelectorAll(".btn-sound-toggle").forEach(btn => {
        btn.addEventListener("click", () => SoundManager.toggleMute());
      });

      // 通常スタート
      document.getElementById("btn-start-normal").addEventListener("click", () => {
        startGame(false);
      });

      // 弱点復習スタート
      document.getElementById("btn-start-weak").addEventListener("click", () => {
        startGame(true);
      });

      // 弱点リセット
      document.getElementById("btn-reset-weak").addEventListener("click", () => {
        SoundManager.playTap();
        showModal({
          title: "弱点リストをリセット",
          message: "保存されている弱点リスト（間違えた筋）をすべて削除しますか？",
          confirmText: "リセットする",
          onConfirm: () => {
            Storage.clearWeak();
            renderStartScreen();
          }
        });
      });

      // プレイ中断
      document.getElementById("btn-quit").addEventListener("click", () => {
        SoundManager.playTap();
        showModal({
          title: "プレイを中断",
          message: "タイトル画面に戻りますか？（現在のタイムは記録されません）",
          confirmText: "タイトルへ戻る",
          confirmClass: "bg-teal-600 hover:bg-teal-700",
          onConfirm: () => {
            stopTimer();
            hideHintBanner();
            renderStartScreen();
            showScreen("screen-start");
          }
        });
      });

      // ヒントバナー手動閉じる
      document.getElementById("btn-close-hint").addEventListener("click", hideHintBanner);

      // グループお題の解答開閉
      document.getElementById("btn-toggle-topic-answer").addEventListener("click", () => {
        SoundManager.playTap();
        const box = document.getElementById("group-topic-answer");
        const chevron = document.getElementById("topic-chevron");
        box.classList.toggle("hidden");
        chevron.classList.toggle("rotate-180");
      });

      // リザルト：もう一度挑戦
      document.getElementById("btn-retry").addEventListener("click", () => {
        // 弱点モードですべて解除された場合はタイトルへ戻す
        if (state.isWeakMode && Storage.getWeakList().length === 0) {
          renderStartScreen();
          showScreen("screen-start");
          return;
        }
        startGame(state.isWeakMode);
      });

      // リザルト：タイトルへ戻る
      document.getElementById("btn-back-title").addEventListener("click", () => {
        SoundManager.playTap();
        renderStartScreen();
        showScreen("screen-start");
      });
    }

    document.addEventListener("DOMContentLoaded", initApp);
  </script>
</body>
